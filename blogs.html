<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouristic - Blogs</title>
    <link rel="icon" href="logoo.png">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* Shared Frutiger Aero Scaling Layout Engine Engine */
        :root {
            --ui-scale: 1;
            --nav-padding: calc(12px * var(--ui-scale));
            --window-padding: calc(clamp(20px, 4vw, 50px) * var(--ui-scale));
            --card-padding: calc(24px * var(--ui-scale));
            --gap-main: calc(24px * var(--ui-scale));
            --font-logo: calc(clamp(20px, 2.5vw, 26px) * var(--ui-scale));
            --font-nav: calc(clamp(14px, 1.5vw, 16px) * var(--ui-scale));
            --font-title: calc(clamp(24px, 3.5vw, 36px) * var(--ui-scale));
            --font-body: calc(clamp(14px, 1.2vw, 16px) * var(--ui-scale));
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            padding: calc(20px * var(--ui-scale));
            background: radial-gradient(circle at 80% 15%, #bbf7d0 0%, transparent 50%),
                        radial-gradient(circle at 20% 75%, #059669 0%, transparent 60%),
                        linear-gradient(135deg, #10b981 0%, #064e3b 100%);
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: var(--gap-main);
            align-items: center;
        }

        nav {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            padding: var(--nav-padding) calc(var(--nav-padding) * 2);
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-top: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: calc(16px * var(--ui-scale));
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.5), 
                        inset 0 -12px 24px rgba(0, 0, 0, 0.08),
                        0 10px 30px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            gap: calc(12px * var(--ui-scale));
        }

        .logo-link img {
            width: calc(48px * var(--ui-scale));
            height: calc(48px * var(--ui-scale));
        }

        .logo-link h1 {
            color: #ffffff;
            font-size: var(--font-logo);
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7), 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .nav-links {
            margin-left: auto;
            display: flex;
            gap: calc(10px * var(--ui-scale));
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #f0fdf4;
            font-size: var(--font-nav);
            font-weight: 600;
            padding: calc(10px * var(--ui-scale)) calc(22px * var(--ui-scale));
            border-radius: calc(8px * var(--ui-scale));
            border: 1px solid transparent;
            transition: all 0.2s ease-in-out;
        }

        .nav-links .active, .nav-links a:hover {
            color: #ffffff;
            background: linear-gradient(to bottom, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 50%, rgba(0,0,0,0.03) 50%, rgba(255,255,255,0.25) 100%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 0 15px rgba(187, 247, 208, 0.6);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
        }

        .window-pane {
            width: 100%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: calc(16px * var(--ui-scale));
            padding: var(--window-padding);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), 0 12px 35px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .view-title {
            font-size: var(--font-title);
            margin-bottom: calc(8px * var(--ui-scale));
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .view-subtitle {
            font-size: var(--font-body);
            color: #ecfdf5;
            margin-bottom: var(--gap-main);
        }

        /* Fluid Grid Design */
        .fluid-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(calc(280px * var(--ui-scale)), 1fr));
            gap: var(--gap-main);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: calc(12px * var(--ui-scale));
            padding: var(--card-padding);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: scale(1.02);
        }

        .glass-card h3 {
            font-size: calc(20px * var(--ui-scale));
            margin-bottom: calc(10px * var(--ui-scale));
        }

        .glass-card p {
            color: #d1fae5;
            font-size: var(--font-body);
            line-height: 1.6;
        }

        .meta-tag {
            display: inline-block;
            font-size: calc(11px * var(--ui-scale));
            background: rgba(0, 0, 0, 0.2);
            padding: calc(4px * var(--ui-scale)) calc(10px * var(--ui-scale));
            border-radius: calc(12px * var(--ui-scale));
            margin-bottom: calc(12px * var(--ui-scale));
            color: #a7f3d0;
            font-weight: 600;
        }

        footer {
            text-align: center;
            font-size: var(--font-nav);
            color: #a7f3d0;
            margin-top: auto;
            padding: calc(10px * var(--ui-scale));
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: calc(12px * var(--ui-scale));
            }
            .nav-links {
                margin-left: 0;
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo-link">
            <img src="logoo.png" alt="Mouristic Logo">
            <h1>Mouristic</h1>
        </a>
        <ul class="nav-links">
            <li><a href="blogs.html" class="active">Blogs</a></li>
            <li><a href="release.html">Release</a></li>
        </ul>
    </nav>

    <main class="window-pane">
        <h2 class="view-title">Developer Journals</h2>
        <p class="view-subtitle">Follow our development blogs.</p>
        
        <div class="fluid-grid">
            <div class="glass-card">
                <span class="meta-tag">Publish by Mouri</span>
                <h3>Fed up</h3>
                <p>I have been taking a break for more than 2 weeks. My pyshical body is getting worse everyday. I don't think this project would be released soon.</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Mouristic.</p>
    </footer>

</body>
</html>
